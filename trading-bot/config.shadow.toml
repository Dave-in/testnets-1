# Теневые боты (6 первых + 5 краткосрочных с плечом): виртуальные деньги, исполнение по реальному стакану Bybit.
# Ордера на биржу не отправляются; ключи API не нужны (только публичные данные).
# Запуск отдельно: python -m bot shadow   |   вместе с остальными ботами — см. bots.toml.

bots = ["liq", "book", "lag", "oi", "fund", "fade", "vwap", "squeeze", "pairs", "ofi", "meme"]
notify_trades = true       # каждая сделка — в тему бота в группе Telegram (группу привязывает /here)
save_every_s = 60

[universe]
skip_top = 10              # 10 самых торгуемых за сутки не берём (BTC, ETH, SOL…)
top = 30                   # из остальных берём до 30 монет по обороту
min_turnover_usd = 10e6    # оборот фьючерса за сутки — не меньше 10 млн $
min_age_days = 60          # контракт торгуется не меньше 2 месяцев
exclude = ["USDCUSDT", "XAUTUSDT"]   # стейблкоин и токен золота
exclude_types = ["stock", "ETF", "commodity", "forex", "index"]   # только криптовалюты
max_spread_bps = 5.0       # спред не больше 0.05% в момент выбора
depth_pct = 0.1            # глубину стакана считаем в пределах 0.1% от цены…
min_depth_usd = 6000.0     # …не меньше 6000 $ на каждой стороне (20 × позиция в 300 $)
# symbols = ["ENAUSDT", "SUIUSDT"]   # явный список вместо автоматического выбора
# BTCUSDT подключается всегда как ориентир для бота «Отставание от BTC», но не торгуется

[account]                  # у каждого бота свой виртуальный счёт с этими настройками
capital = 100.0            # USDT
risk_per_trade = 0.01      # срабатывание стопа стоит 1% счёта
max_leverage = 10.0        # сумма позиций не больше 10 размеров счёта
max_positions = 3
max_position_leverage = 3.0   # одна позиция — не больше 3 размеров счёта
min_stop_pct = 0.004       # стоп не ближе 0.4% от цены: ближе — стоп отодвигается, позиция уменьшается
min_reward_cost = 2.5      # тейк минимум в 2.5 раза больше издержек сделки (комиссии + проскальзывание туда-обратно)
min_notional = 5.0         # минимальная позиция Bybit
maker_fee = 0.0002         # 0.02% — лимитный ордер
taker_fee = 0.00055        # 0.055% — рыночный ордер и стоп
latency_ms = 250           # задержка между сигналом и исполнением

[liq]                      # 1. Ликвидации: вход против иссякшего каскада
window_s = 60              # окно подсчёта ликвидаций
mult = 5.0                 # ликвидаций в 5 раз больше обычного…
min_usd = 20000.0          # …и не меньше 20 000 $ за минуту (50 000 на альтах почти не бывает)
move_sigma = 2.5           # цена за минуту ушла на 2.5σ
quiet_s = 15               # 15 с без новых ликвидаций и без нового экстремума
retrace = 0.5              # тейк — возврат половины движения
sl_frac = 0.3              # стоп — ещё 30% движения за экстремумом
time_stop_s = 900

[book]                     # 2. Стакан: перекос заявок + поток сделок, вход лимиткой
levels = 3                 # 3 лучших уровня: глубже стакан легко заспуфить
obi = 0.5                  # перекос стакана по 3 уровням не меньше 0.5…
persist_s = 5              # …держится 5 секунд подряд
micro = 0.2                # микроцена сдвинута в ту же сторону на 20% спреда
flow = 0.2                 # агрессивные сделки за 30 с в ту же сторону
horizon_s = 60             # перекос живёт секунды: тейк и стоп — по ходу цены за 60 с
tp_sigma = 1.0
sl_sigma = 1.0
ttl_s = 15                 # лимитка живёт 15 секунд
time_stop_s = 60           # держим не дольше минуты

[lag]                      # 3. Отставание от BTC
ref = "BTCUSDT"
window_s = 60
z = 2.5                    # BTC за минуту сдвинулся на 2.5σ
gap = 0.6                  # альт прошёл меньше 40% от ожидаемого
tp_frac = 0.8              # тейк — 80% отставания
min_reward_cost = 3.0      # тейк ≥ 3 × (комиссии + проскальзывание туда-обратно)
time_stop_s = 180

[oi]                       # 4. Открытый интерес: движение с новыми деньгами
window_s = 300
z = 1.5                    # цена за 5 минут ушла на 1.5σ…
oi_min = 0.005             # …и открытый интерес вырос на 0.5%
trail_sigma = 1.5
time_stop_s = 1800

[fund]                     # 5. Фандинг: против перекошенной толпы
rate = 0.0005              # |ставка| ≥ 0.05% за 8 часов (обычная 0.01%); ставки с интервалом 1 или 4 ч приводятся к 8 ч
window_s = 900
sl_sigma = 2.0
tp_sigma = 3.0
time_stop_s = 14400

[fade]                     # 6. Откат после резкого движения (контроль)
window_s = 300
z = 3.0
quiet_s = 30
sl_sigma = 1.0
time_stop_s = 900

# ---------------------------------------------------------------------------------------------
# Краткосрочные боты с плечом. Изолированная маржа как на Bybit: leverage — настройка плеча
# на бирже (маржа позиции = сумма / плечо, ликвидация по марк-цене). Размер позиции — из риска:
# стоп стоит risk_per_trade баланса; пределы — max_position_leverage на позицию и max_leverage
# на счёт. Лонг и шорт без ограничений.

[vwap]                     # 7. Возврат к VWAP (процесс Орнштейна–Уленбека), вход и тейк лимитками
z_entry = 2.0              # вход при отклонении от VWAP за 15 мин на 2σ…
z_stop = 3.5               # …стоп при 3.5σ
max_half_life = 10.0       # только монеты в режиме возврата: полупериод ≤ 10 мин…
max_vr = 0.9               # …и отношение дисперсий VR(5) < 0.9 (склонность к откатам)
max_hold_min = 20
[vwap.account]
risk_per_trade = 0.01
leverage = 20.0
max_position_leverage = 10.0
max_leverage = 20.0
max_positions = 3

[squeeze]                  # 8. Пробой после сжатия полос Боллинджера, с объёмом
bw_pct = 10.0              # полосы уже 10% самых узких за 6 ч
range_s = 1800             # пробой диапазона последних 30 мин
vol_z = 2.0                # объём минуты выше обычного на 2σ
tp_atr = 3.0
trail_atr = 1.5
time_stop_s = 1800
[squeeze.account]
risk_per_trade = 0.01
leverage = 20.0
max_position_leverage = 10.0
max_leverage = 20.0
max_positions = 3

[pairs]                    # 9. Парный арбитраж: коинтеграция, лонг одной монеты + шорт другой
corr_min = 0.8             # корреляция минутных доходностей за 6 ч
adf_t = -3.34              # спред стационарен (Энгл–Грейнджер, ~5%)
z_entry = 2.0
z_exit = 0.5
z_stop = 4.0
max_hold_min = 120
[pairs.account]
risk_per_trade = 0.01
leverage = 20.0
max_position_leverage = 10.0
max_leverage = 20.0
max_positions = 4          # 2 пары по 2 ноги

[ofi]                      # 10. Поток ордеров (OFI) + лямбда Кайла, вход лимиткой
min_r2 = 0.05              # связь OFI → цена по последнему часу заметна
min_reward_cost = 3.0      # прогноз хода ≥ 3 × издержек сделки
time_stop_s = 120
[ofi.account]
risk_per_trade = 0.01
leverage = 20.0
max_position_leverage = 10.0
max_leverage = 20.0
max_positions = 3

[meme]                     # 11. Мемы: возврат к VWAP, агрессивно
universe = "meme"          # торгует только монетами из [meme_universe]
z_entry = 1.5
z_stop = 3.0
max_half_life = 15.0
max_vr = 0.95
max_hold_min = 30
[meme.account]
risk_per_trade = 0.03      # стоп стоит 3% баланса
leverage = 20.0
max_position_leverage = 20.0
max_leverage = 20.0
max_positions = 3

[meme_universe]            # мем-токены; берутся те, у кого сейчас есть оборот и стакан
symbols = ["DOGEUSDT", "1000PEPEUSDT", "SHIB1000USDT", "WIFUSDT", "1000BONKUSDT", "FARTCOINUSDT",
           "PENGUUSDT", "POPCATUSDT", "1000FLOKIUSDT", "TRUMPUSDT", "BRETTUSDT", "MEWUSDT",
           "MOODENGUSDT", "PNUTUSDT", "GOATUSDT", "SPXUSDT", "PUMPFUNUSDT", "BOMEUSDT",
           "USELESSUSDT", "1000NEIROCTOUSDT", "MEMEUSDT", "PEOPLEUSDT"]
min_turnover_usd = 5e6
max_spread_bps = 10.0
depth_pct = 0.1
min_depth_usd = 3000.0
