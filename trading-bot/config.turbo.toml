# ТУРБО: агрессивный режим «попыток» на фьючерсах. Маленький счёт, плечо до x5,
# риск 20% счёта на сделку, цель — умножить счёт в 10 раз. Попытка заканчивается победой (x10)
# или сливом (осталось меньше 20%), после чего начинается новая с тем же стартовым счётом.
# ВНИМАНИЕ: слив попытки — обычный исход, а не авария. Шансы по истории — в README.md.
# Сигналы те же, что у config.trend.toml (у них есть подтверждённое преимущество);
# на часовых свечах с плечом счёт сливался во всех попытках, поэтому решения — раз в сутки,
# а стопы проверяются каждую минуту.

[exchange]
name = "binance"
mode = "paper"            # виртуальный счёт; реальных ордеров нет, ключи биржи не нужны
market = "futures"        # бессрочные фьючерсы: плечо и фандинг
timeframe = "1d"          # решения раз в сутки, после закрытия дня (00:00 UTC)
fee = 0.0005              # комиссия фьючерсов 0.05%
slippage = 0.001          # проскальзывание взято с запасом: на плече оно бьёт сильнее

[portfolio]
profile = "turbo"
initial_capital = 50.0      # ставка на одну попытку, USDT
max_gross_exposure = 5.0    # сумма всех позиций до 5 размеров счёта: плечо x5
monthly_target = 0.30

# Монеты и максимальный размер позиции в размерах счёта. Бот держит до max_positions сильнейших.
[portfolio.profiles.turbo]
"BTC/USDT" = 5.0
"ETH/USDT" = 5.0
"SOL/USDT" = 5.0
"BNB/USDT" = 5.0
"XRP/USDT" = 5.0
"DOGE/USDT" = 5.0
"AVAX/USDT" = 5.0
"LINK/USDT" = 5.0
"ADA/USDT" = 5.0
"XLM/USDT" = 5.0
"DOT/USDT" = 5.0
"UNI/USDT" = 5.0

[strategy]
entry_mode = "ema"
fast_ema = 10               # вход: цена > EMA10 > EMA50 и рост за 20 дней
slow_ema = 50
momentum_lookback = 20
min_trend_quality = 0.3     # и движение за эти 20 дней было ровным, а не «пилой»
atr_period = 14
atr_stop_mult = 3.5         # трейлинг-стоп: максимум закрытия − 3.5·ATR
vol_lookback = 20
target_vol = 1000.0         # ограничение по волатильности выключено: размер задаёт риск на сделку
risk_per_trade = 0.20       # срабатывание стопа стоит 20% счёта (в обычных ботах — 1%)
allow_short = false         # шорты выключены: на истории они ухудшали шансы (см. README)
learn_window = 5            # учёт ошибок: 5 последних сделок связки «монета+направление» в минусе →
learn_block_bars = 20       # …связка отключается на 20 дней
learn_loss_streak = 3       # 3 убыточные сделки подряд → размер позиций вдвое меньше
learn_risk_cut = 0.5        # …до первой прибыльной сделки
rebalance_threshold = 0.4   # меньше мелких «докупить/сократить» → меньше сообщений и комиссий
min_trade = 0.02
reentry_cooldown_bars = 3
max_positions = 4
regime_symbol = "BTC/USDT"  # фильтр рынка: торгуем, только пока BTC выше своей EMA200…
regime_ema = 200
regime_exit = true          # …иначе выходим в USDT и ждём

[risk]
hard_stop_action = "off"    # защита по просадке выключена: её роль играет порог слива попытки

[challenge]
enabled = true
target_mult = 10.0          # цель: счёт x10
bust_fraction = 0.2         # слив: осталось меньше 20% стартового счёта

[live]
poll_seconds = 60           # проверка цен и стопов раз в минуту
state_dir = "state"

[telegram]
enabled = true              # токен и chat_id — в файле .env (см. README)
daily_report = true         # отчёт каждый день в 00:00 UTC
