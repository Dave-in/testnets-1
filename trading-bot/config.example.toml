# Конфиг консервативного бота. Скопируйте в config.toml и правьте под себя.
#   cp config.example.toml config.toml

[exchange]
name = "binance"          # binance | bybit | okx | любой из ccxt
mode = "paper"            # paper (виртуальные деньги, реальные цены) | testnet | live
timeframe = "1d"          # 1d — основной; 4h — чаще сделки, больше комиссий
fee = 0.001               # 0.1% taker (спот Binance/Bybit без скидок)
slippage = 0.0005         # 0.05% проскальзывание на каждую сделку

[portfolio]
# Профиль "core": только ETH. Профиль "balanced": ETH + немного крупных альтов.
# Значение — максимальная доля капитала в активе.
profile = "core"
initial_capital = 10000.0   # USDT, для бэктеста и paper
monthly_target = 0.06       # цель в месяц — для отчета (сколько месяцев ее выполнили)
max_gross_exposure = 1.0    # без плеча: сумма позиций <= 100% капитала

[portfolio.profiles.core]
"ETH/USDT" = 1.0

[portfolio.profiles.balanced]
"ETH/USDT" = 0.50
"BTC/USDT" = 0.40
"SOL/USDT" = 0.15
"BNB/USDT" = 0.15

[strategy]
fast_ema = 50             # быстрая средняя (баров)
slow_ema = 200            # медленная средняя — фильтр тренда
momentum_lookback = 90    # рост за N баров должен быть > 0
atr_period = 14
atr_stop_mult = 3.0       # трейлинг-стоп: максимум закрытия - 3*ATR
vol_lookback = 30         # окно для оценки волатильности
target_vol = 0.12         # целевая годовая волатильность портфеля (12%)
rebalance_threshold = 0.2   # меняем позицию, только если цель отличается > 20% от ее размера
min_trade = 0.01            # и минимум на 1% капитала — иначе комиссии съедят
reentry_cooldown_bars = 5   # после стопа ждем N баров перед повторным входом
max_positions = 0           # 0 — все активы профиля; N — только N сильнейших

[risk]
# Защита от просадки (от пика капитала):
soft_drawdown = 0.025     # с -2.5% начинаем плавно урезать позиции…
soft_scale = 0.25         # …до 25% от обычного размера у самого жесткого лимита
hard_drawdown = 0.065     # при -6.5% закрываем все и ставим на паузу
cooldown_bars = 10        # пауза после жесткого стопа (баров)
# Что делать после жесткого стопа:
#   "halt"  — остановиться совсем до ручного перезапуска. Просадка от пика
#             гарантированно ~6.5% (кроме обвалов гэпом между проверками).
#   "pause" — после паузы торговать дальше с урезанным риском. Бот продолжает
#             работать, но суммарная просадка за несколько неудачных серий
#             может быть больше лимита (на тестах 8–15%).
hard_stop_action = "pause"
resume_drawdown = 0.04    # после паузы стартуем "как будто уже -4%" → позиции урезаны

[live]
poll_seconds = 60         # как часто проверять цены/стопы в paper/testnet/live
state_dir = "state"
