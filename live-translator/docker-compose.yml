# Приложение + Caddy (автоматический HTTPS-сертификат Let's Encrypt).
# Перед запуском: cp .env.example .env, заполнить ключи и DOMAIN.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Укажите DOMAIN в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
